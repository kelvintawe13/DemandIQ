# DemandIQ — retrain and publish a serving bundle.
#
# Manual only. Training takes minutes of CPU and replaces the model the API
# serves, so it must not be a side effect of a push: `.github/workflows/ci.yml`
# deliberately keeps the pipeline out of push CI, and this workflow is the way to
# run it on purpose.
#
# What it does: retrains exactly as `make train-model` records it, exports
# `serving_bundle.joblib`, and publishes it to the model service with
# `scripts/publish_bundle.sh` (§10 of docs/RAILWAY.md). The publish step reads the
# file back and compares SHA-256, so a green run means the service is serving the
# bytes this run produced.
#
# It does not redeploy the API. The API fetches the bundle once, at startup, so
# the new export reaches forecasts after
#   railway redeploy --service api --yes
# That is also the rollback boundary: until then, the previous export keeps
# answering, and every published export stays on the volume (`GET /bundles`).
#
# It does not touch backend/artifacts/serving_bundle.joblib, the export baked
# into the API image, so the fallback used when the model service is unreachable
# stays as committed. Update it locally with `make train-model`, copy it across
# and commit, when a new model should also be the fallback.
#
# Configuration (Settings → Secrets and variables → Actions):
#   variable  MODEL_SERVICE_URL   public URL of the model service
#   secret    BUNDLE_ADMIN_TOKEN  the same value as the service's variable
#
# Both are checked before training starts: a missing URL or token is a
# configuration mistake that ten minutes of CPU will not fix.

name: Publish model bundle

on:
  workflow_dispatch:
    inputs:
      tune_trials:
        description: "Tuning configurations to evaluate (8 matches `make train-model`)"
        required: false
        default: "8"
        type: string
      backtest:
        description: "Run the rolling-origin backtest stage"
        required: false
        default: true
        type: boolean

# Two publishes racing would make it ambiguous which export is latest.
concurrency:
  group: publish-bundle
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Retrain and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      MODEL_SERVICE_URL: ${{ vars.MODEL_SERVICE_URL }}

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # 3.11 matches the images and the declared floor in model/pyproject.toml,
      # so the export this produces is one the API image can load.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: model/pyproject.toml

      # [training] is what the pipeline needs and the API image does not:
      # lightgbm, catboost, xgboost, scikit-learn, shap.
      - name: Install the pipeline
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "model[training]"

      - name: Check the publish target
        env:
          BUNDLE_ADMIN_TOKEN: ${{ secrets.BUNDLE_ADMIN_TOKEN }}
        run: |
          missing=""
          [ -n "${MODEL_SERVICE_URL:-}" ] || missing="$missing MODEL_SERVICE_URL (repository variable)"
          [ -n "${BUNDLE_ADMIN_TOKEN:-}" ] || missing="$missing BUNDLE_ADMIN_TOKEN (repository secret)"
          if [ -n "$missing" ]; then
            echo "::error::Not configured:$missing. See docs/RAILWAY.md §10."
            exit 1
          fi
          echo "Publishing to $MODEL_SERVICE_URL"

      # The same arguments as the `train-model` target, and deliberately the same
      # data: model/data/recruit is committed, so a clean checkout reproduces the
      # recorded run's inputs rather than training on whatever is on a laptop.
      - name: Retrain
        working-directory: model
        run: |
          python -m diq_model.train train \
            --data-root data/recruit \
            --checkpoints artifacts/runs/latest \
            --test-start 2017-02-01 \
            --seed 42 \
            --tune-trials "${{ inputs.tune_trials }}" \
            ${{ inputs.backtest && '--with-backtest' || '' }} \
            --force

      # The bundle is what the API reads; the run directory is not shipped.
      - name: Export the serving bundle
        working-directory: model
        run: python scripts/export_serving_bundle.py --artifacts artifacts/runs/latest

      - name: Publish and verify
        env:
          BUNDLE_ADMIN_TOKEN: ${{ secrets.BUNDLE_ADMIN_TOKEN }}
        run: |
          bash scripts/publish_bundle.sh \
            model/artifacts/runs/latest/serving_bundle.joblib \
            "$MODEL_SERVICE_URL"

      # The run's only durable output on GitHub's side. Without this, the export
      # exists only on the volume, and a rejected publish leaves nothing to
      # inspect.
      - name: Keep the export with the run
        uses: actions/upload-artifact@v4
        with:
          name: serving-bundle
          path: model/artifacts/runs/latest/serving_bundle.joblib
          retention-days: 14
          if-no-files-found: error

      - name: Summarise
        env:
          REF: ${{ github.ref_name }}
          WHO: ${{ github.actor }}
          TRIALS: ${{ inputs.tune_trials }}
          BACKTEST: ${{ inputs.backtest }}
        run: |
          {
            echo
            echo "Trained on \`$REF\` by \`$WHO\` — tune trials: $TRIALS, backtest: $BACKTEST."
            echo "The API serves this export after \`railway redeploy --service api --yes\`."
          } >> "$GITHUB_STEP_SUMMARY"
