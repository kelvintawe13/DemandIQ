[project]
name = "demandiq-model"
version = "0.1.0"
description = "ML pipeline for DemandIQ demand forecasting platform"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    "python-dateutil>=2.8.0",
    "joblib>=1.3.0",
    # ``evaluate/tables.py`` renders the Chapter 4 tables with
    # ``DataFrame.to_markdown``, which imports tabulate at call time. It is a
    # runtime dependency of the pipeline, not an optional extra: without it the
    # baseline stage fails on a clean install.
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
# What it takes to *read* an exported serving bundle: joblib has to unpickle the
# LightGBM booster to validate it, so the model service installs this even when
# it does not train. Matches the backend's `model` extra.
serving = [
    "lightgbm>=4.0.0",
]
# Heavy training deps: preinstalled on Colab, install locally only when needed.
training = [
    "lightgbm>=4.0.0",
    "catboost>=1.2.0",
    "xgboost>=2.0.0",
    "scikit-learn>=1.3.0",
    "shap>=0.43.0",
    # The pipeline writes its stage artifacts as parquet and the export reads
    # predictions back. Colab preinstalls pyarrow, which is why this was missing
    # here: a clean install (CI, the model service) failed at the first
    # to_parquet or read_parquet instead.
    "pyarrow>=14.0.0",
]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
