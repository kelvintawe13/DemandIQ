[project]
name = "demandiq-model"
version = "0.1.0"
description = "ML pipeline for DemandIQ demand forecasting platform"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    "python-dateutil>=2.8.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
# Heavy training deps: preinstalled on Colab, install locally only when needed.
training = [
    "lightgbm>=4.0.0",
    "catboost>=1.2.0",
    "xgboost>=2.0.0",
    "scikit-learn>=1.3.0",
    "shap>=0.43.0",
]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
