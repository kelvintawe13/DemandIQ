# DemandIQ frontend — nginx in front of the SPA bundle, reverse-proxying the API.
#
# Replaces the stock default.conf in nginxinc/nginx-unprivileged. Two things
# here are load-bearing rather than stylistic:
#
#   1. proxy_pass goes through a variable plus an explicit `resolver`. With a
#      literal upstream name (`proxy_pass http://backend:8000`) nginx resolves
#      the name ONCE at config load; if the backend container is not up yet,
#      nginx fails to start with "host not found in upstream" and crash-loops,
#      and if the backend is later recreated with a new IP it keeps dialling the
#      stale one. `resolver 127.0.0.11` is Docker's embedded DNS, so the lookup
#      happens per request and follows the container.
#   2. client_max_body_size is raised from nginx's 1MB default. The ingestion
#      screens upload Excel/CSV datasets; left at the default, every upload
#      fails with 413 before Python sees it. The backend sets no size cap of
#      its own, so this is currently the only limit in the path.

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Uploads: see note 2 above. Raise alongside any future backend cap.
    client_max_body_size 50m;
    client_body_timeout  300s;

    # Inference, SHAP and policy simulation are not instant; the default 60s
    # read timeout cuts off long requests that the API would have answered.
    proxy_connect_timeout 10s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host  $host;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        $connection_upgrade;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/xml image/svg+xml;

    # No Content-Security-Policy here on purpose. A correct policy has to
    # allowlist the Turnstile challenge host and Google's identity origins, and
    # getting that wrong breaks sign-in in a way that is very hard to diagnose
    # from a bundle. Ship CSP from the real edge, where it can be tuned per
    # environment. The headers below are the safe subset.
    add_header X-Content-Type-Options "nosniff"            always;
    add_header X-Frame-Options        "SAMEORIGIN"         always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # Container liveness only — deliberately not a proxy of the API's /health,
    # so an API outage does not get this container restarted.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---------------------------------------------------------------------
    # API + docs, proxied to the FastAPI container.
    # ---------------------------------------------------------------------
    location /api/ {
        proxy_pass $upstream$request_uri;
    }

    location = /console      { proxy_pass $upstream$request_uri; }
    location = /health       { access_log off; proxy_pass $upstream$request_uri; }
    location = /openapi.json { proxy_pass $upstream$request_uri; }
    location = /docs         { proxy_pass $upstream$request_uri; }
    location = /redoc        { proxy_pass $upstream$request_uri; }

    # / is the API console on the backend (backend/app/main.py serves the
    # OpenAPI console there, and JSON when it is disabled) — so / is proxied
    # rather than served from this bundle. The product UI is under /app/.
    location / {
        proxy_pass $upstream$request_uri;
    }

    # ---------------------------------------------------------------------
    # The SPA, under /app/ because vite.config.ts compiles `base: '/app/'`.
    # ---------------------------------------------------------------------
    location = /app {
        return 301 /app/;
    }

    # Vite emits content-hashed filenames into /app/assets, so they can be
    # cached immutably. try_files =404 (not the SPA fallback) so a stale
    # index.html asking for a deleted chunk gets an honest 404 instead of
    # being handed HTML as a script.
    #
    # NOTE: `expires 1y` is deliberately not used. It emits its own
    # Cache-Control: max-age=..., which would land alongside the immutable one
    # below as a duplicate header.
    #
    # NOTE: the security headers are repeated in every location that sets
    # add_header. nginx's add_header does not merge with inherited values — one
    # add_header in a location discards ALL of the server-level ones. Omitting
    # them here would silently ship the SPA shell without nosniff.
    location /app/assets/ {
        add_header Cache-Control          "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff"            always;
        add_header X-Frame-Options        "SAMEORIGIN"         always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        try_files  $uri =404;
    }

    # Client-side routing: /app/ingestion, /app/quality and friends are not files
    # on disk, so any miss falls through to the SPA shell. This must mirror the
    # backend's own _SpaStaticFiles fallback for the topology where the API
    # serves the bundle itself.
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    # index.html must never be cached, or a deploy leaves clients requesting
    # asset filenames that no longer exist. Security headers repeated for the
    # add_header-replaces-inheritance reason noted above.
    location = /app/index.html {
        add_header Cache-Control          "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff"            always;
        add_header X-Frame-Options        "SAMEORIGIN"         always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    }
}

# Resolver and the upstream, declared at http level because `set` is not allowed
# in an included snippet's http context and the variables are used per-request.
# 127.0.0.11 is Docker's embedded DNS server; it is only correct under Compose
# (or any Docker network), which is the only place this file is used.
resolver 127.0.0.11 ipv6=off valid=10s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

set $upstream http://backend:8000;
